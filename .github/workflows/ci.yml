name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Derives the SHAs for `nx affected` (sets NX_BASE and NX_HEAD).
      - uses: nrwl/nx-set-shas@v5

      - run: pnpm exec nx format:check

      # Typecheck all packages to catch transitive errors not in the affected graph.
      - run: pnpm exec nx run-many -t typecheck

      - run: pnpm exec nx affected -t lint test build
