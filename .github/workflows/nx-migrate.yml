name: Nx migrate

on:
  schedule:
    - cron: '0 6 * * *' # Every night at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run nx migrate
        run: pnpm exec nx migrate latest

      # Read the target version from package.json rather than the registry:
      # pnpm’s minimumReleaseAge can make nx migrate settle on an older release.
      - name: Check for newer Nx version
        id: check
        run: |
          current=$(git show HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).devDependencies.nx")
          latest=$(node -p "require('./package.json').devDependencies.nx")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Already on latest Nx version ($current)."
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Nx update available: $current -> $latest"
          fi

      - name: Install updated dependencies
        if: steps.check.outputs.up_to_date == 'false'
        run: pnpm install --no-frozen-lockfile

      - name: Run migrations
        if: steps.check.outputs.up_to_date == 'false' && hashFiles('migrations.json') != ''
        run: pnpm exec nx migrate --run-migrations | tee "$RUNNER_TEMP/migrate.log"

      # Nx skips agent-driven migrations in CI and lists their prompt files.
      # Put those prompts in the PR description instead of committing them.
      - name: Write pull request body
        if: steps.check.outputs.up_to_date == 'false'
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Automated Nx migration from $CURRENT to $LATEST."
            echo
            echo 'This PR was created by `nx migrate`, which also ran the code migrations (codemods) for the new version.'
          } > "$body"
          prompts=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/migrate.log" 2>/dev/null | grep -oE '^[[:space:]]*- tools/ai-migrations/[^[:space:]]+\.md' | sed -E 's/^[[:space:]]*- //' || true)
          if [ -n "$prompts" ]; then
            {
              echo
              echo '## Agent-driven migrations'
              echo
              echo 'Nx skipped these migrations in CI because they need an agent. Apply each prompt to this branch, in order, before merging:'
              for prompt in $prompts; do
                echo
                echo "<details><summary><code>$prompt</code></summary>"
                echo
                cat "$prompt"
                echo
                echo '</details>'
              done
            } >> "$body"
          fi
          rm -rf migrations.json tools/ai-migrations

      - name: Generate app token
        if: steps.check.outputs.up_to_date == 'false'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # A fixed branch keeps a single migration PR open: each run updates it
      # to the latest Nx version on top of main instead of opening another.
      - name: Create pull request
        if: steps.check.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: build/nx-migrate
          commit-message: 'build(deps): migrate Nx to ${{ steps.check.outputs.latest }}'
          title: 'build(deps): migrate Nx to ${{ steps.check.outputs.latest }}'
          body-path: ${{ runner.temp }}/pr-body.md
