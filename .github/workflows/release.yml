name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # needed for provenance data generation and NPM trusted publishing OIDC

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full git history for nx release to work properly
          fetch-depth: 0
          filter: tree:0
          token: ${{ secrets.PAT }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest main (a previous release run may have pushed)
        run: git pull --rebase origin main

      - run: pnpm exec nx release --skip-publish
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }} # Needed for pushing release commits.

      - run: pnpm exec nx release publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
